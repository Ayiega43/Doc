
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>MediBoard · hospital careers</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    :root {
      --primary: #0a4b7a;
      --primary-light: #1b6b9e;
      --primary-soft: #e8f0f9;
      --accent: #1e8e6d;
      --accent-soft: #e0f2ec;
      --neutral-50: #f9fbfd;
      --neutral-100: #f1f5f9;
      --neutral-200: #e2e8f0;
      --neutral-300: #cbd5e1;
      --neutral-600: #475569;
      --neutral-800: #1e293b;
      --white: #ffffff;
      --shadow-sm: 0 2px 5px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.06);
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-sm: 10px;
    }

    body {
      background-color: var(--neutral-50);
      color: var(--neutral-800);
      line-height: 1.5;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-wrapper {
      max-width: 1280px;
      width: 100%;
    }

    /* header */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      gap: 1rem;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .logo-icon {
      background: var(--primary);
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .logo-text {
      font-weight: 700;
      font-size: 1.7rem;
      letter-spacing: -0.02em;
      color: var(--primary);
    }

    .logo-text span {
      font-weight: 400;
      color: var(--neutral-600);
      font-size: 1rem;
      margin-left: 6px;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--white);
      padding: 0.5rem 1.2rem 0.5rem 0.8rem;
      border-radius: 50px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--neutral-200);
    }

    .user-badge i {
      color: var(--primary);
      font-size: 1.2rem;
    }

    .user-badge .balance {
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.2rem 0.7rem;
      border-radius: 40px;
      font-size: 0.9rem;
    }

    .user-badge .balance i {
      font-size: 0.8rem;
      margin-right: 3px;
      color: var(--accent);
    }

    /* hero stats */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--white);
      padding: 1rem 1.2rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--neutral-200);
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }

    .stat-card i {
      font-size: 1.8rem;
      color: var(--primary-light);
      opacity: 0.8;
    }

    .stat-card h4 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--neutral-600);
      font-weight: 500;
    }

    .stat-card .value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--neutral-800);
      line-height: 1.2;
    }

    /* search + filter */
    .search-section {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-bottom: 2rem;
      background: var(--white);
      padding: 1rem 1.2rem;
      border-radius: 60px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--neutral-200);
      align-items: center;
    }

    .search-box {
      flex: 2;
      min-width: 220px;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--neutral-100);
      border-radius: 40px;
      padding: 0.5rem 1rem;
    }

    .search-box i {
      color: var(--neutral-600);
    }

    .search-box input {
      border: none;
      background: transparent;
      width: 100%;
      font-size: 1rem;
      outline: none;
      padding: 0.4rem 0;
    }

    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--neutral-300);
      padding: 0.5rem 1.1rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--neutral-600);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .filter-btn:hover {
      background: var(--primary-soft);
      border-color: var(--primary-light);
    }

    /* job grid */
    .job-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-top: 0.5rem;
    }

    .job-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--neutral-200);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }

    .job-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--neutral-300);
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.8rem;
    }

    .hospital-icon {
      background: var(--primary-soft);
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 1.4rem;
    }

    .salary-badge {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      padding: 0.3rem 0.9rem;
      border-radius: 40px;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .job-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0.3rem 0 0.2rem;
      color: var(--neutral-800);
      line-height: 1.3;
    }

    .hospital-name {
      font-weight: 500;
      color: var(--primary-light);
      font-size: 0.95rem;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .job-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 0.8rem 0 1rem;
      font-size: 0.9rem;
      color: var(--neutral-600);
    }

    .job-meta i {
      margin-right: 4px;
      color: var(--primary-light);
      width: 16px;
    }

    .job-desc {
      font-size: 0.92rem;
      color: var(--neutral-600);
      margin-bottom: 1.2rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex-grow: 1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      border-top: 1px solid var(--neutral-200);
      padding-top: 1rem;
    }

    .fee-tag {
      font-size: 0.85rem;
      color: var(--neutral-600);
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--neutral-100);
      padding: 0.3rem 0.8rem;
      border-radius: 30px;
    }

    .fee-tag i {
      color: var(--primary);
      font-size: 0.8rem;
    }

    .apply-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.65rem 1.5rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .apply-btn:hover {
      background: var(--primary-light);
    }

    .apply-btn:active {
      transform: scale(0.96);
    }

    .apply-btn i {
      font-size: 0.85rem;
    }

    /* MODAL (payment / apply) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      padding: 1rem;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--white);
      max-width: 460px;
      width: 100%;
      border-radius: 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
      padding: 1.8rem 1.8rem 2rem;
      transform: translateY(15px);
      transition: transform 0.2s;
    }

    .modal-overlay.open .modal {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    .modal-header h3 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: var(--neutral-600);
      line-height: 1;
    }

    .modal-job-info {
      background: var(--neutral-50);
      padding: 1rem;
      border-radius: var(--radius-md);
      margin-bottom: 1.5rem;
      border: 1px solid var(--neutral-200);
    }

    .modal-job-info .hospital {
      font-weight: 600;
      color: var(--primary);
    }

    .modal-job-info .title {
      font-weight: 700;
      font-size: 1.1rem;
      margin: 0.2rem 0;
    }

    .payment-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 0;
      font-size: 1.1rem;
      border-bottom: 1px dashed var(--neutral-300);
      margin-bottom: 1.2rem;
    }

    .payment-summary .amount {
      font-weight: 800;
      color: var(--accent);
      font-size: 1.6rem;
    }

    .payment-method {
      display: flex;
      gap: 0.8rem;
      margin: 1.2rem 0;
    }

    .method-option {
      flex: 1;
      border: 1px solid var(--neutral-300);
      border-radius: 14px;
      padding: 0.8rem 0.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.1s;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--neutral-600);
    }

    .method-option i {
      display: block;
      font-size: 1.3rem;
      margin-bottom: 4px;
      color: var(--primary-light);
    }

    .method-option.selected {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 600;
    }

    .method-option.selected i {
      color: var(--primary);
    }

    .modal-actions {
      display: flex;
      gap: 0.8rem;
      margin-top: 1.6rem;
    }

    .btn-cancel {
      flex: 1;
      background: var(--neutral-100);
      border: 1px solid var(--neutral-200);
      padding: 0.85rem;
      border-radius: 40px;
      font-weight: 600;
      color: var(--neutral-600);
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-cancel:hover {
      background: var(--neutral-200);
    }

    .btn-pay {
      flex: 2;
      background: var(--primary);
      border: none;
      padding: 0.85rem;
      border-radius: 40px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .btn-pay:hover {
      background: var(--primary-light);
    }

    .btn-pay:disabled {
      background: var(--neutral-300);
      cursor: not-allowed;
      color: var(--neutral-600);
    }

    /* toast */
    .toast-message {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--neutral-800);
      color: white;
      padding: 0.8rem 1.8rem;
      border-radius: 60px;
      font-weight: 500;
      box-shadow: var(--shadow-md);
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 1100;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .toast-message.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-message i {
      color: #4ade80;
    }

    /* empty state */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      background: var(--white);
      border-radius: var(--radius-lg);
      border: 1px dashed var(--neutral-300);
      color: var(--neutral-600);
    }

    /* responsive */
    @media (max-width: 640px) {
      body {
        padding: 1rem 0.8rem;
      }

      .logo-text {
        font-size: 1.4rem;
      }

      .search-section {
        border-radius: var(--radius-md);
        padding: 1rem;
      }

      .filter-tabs {
        width: 100%;
      }

      .filter-btn {
        flex: 1;
        text-align: center;
        padding: 0.5rem 0.5rem;
        font-size: 0.8rem;
      }

      .job-grid {
        grid-template-columns: 1fr;
      }

      .job-card {
        padding: 1.2rem;
      }

      .modal {
        padding: 1.5rem;
      }

      .toast-message {
        white-space: normal;
        max-width: 90%;
        text-align: center;
      }
    }

    @media (max-width: 480px) {
      .user-badge .balance {
        font-size: 0.8rem;
        padding: 0.15rem 0.5rem;
      }

      .stat-card {
        padding: 0.8rem;
      }

      .stat-card .value {
        font-size: 1.2rem;
      }

      .card-footer {
        flex-wrap: wrap;
        gap: 0.6rem;
      }

      .apply-btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <!-- top bar -->
    <div class="top-bar">
      <div class="logo-area">
        <div class="logo-icon"><i class="fas fa-hospital"></i></div>
        <div class="logo-text">MediBoard<span>hospital careers</span></div>
      </div>
      <div class="user-badge">
        <i class="fas fa-user-md"></i>
        <span>Dr. Chen</span>
        <span class="balance"><i class="fas fa-wallet"></i> $245.00</span>
      </div>
    </div>

    <!-- stats -->
    <div class="stats-row">
      <div class="stat-card">
        <i class="fas fa-briefcase"></i>
        <div>
          <h4>Open roles</h4>
          <div class="value">48</div>
        </div>
      </div>
      <div class="stat-card">
        <i class="fas fa-building"></i>
        <div>
          <h4>Hospitals</h4>
          <div class="value">17</div>
        </div>
      </div>
      <div class="stat-card">
        <i class="fas fa-clock"></i>
        <div>
          <h4>Avg. apply fee</h4>
          <div class="value">$9.99</div>
        </div>
      </div>
    </div>

    <!-- search + filters -->
    <div class="search-section">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search by title, hospital, or location…" />
      </div>
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nursing">Nursing</button>
        <button class="filter-btn" data-filter="physician">Physician</button>
        <button class="filter-btn" data-filter="allied">Allied Health</button>
      </div>
    </div>

    <!-- job grid -->
    <div class="job-grid" id="jobGrid"></div>
  </div>

  <!-- payment modal -->
  <div class="modal-overlay" id="paymentModal">
    <div class="modal">
      <div class="modal-header">
        <h3><i class="fas fa-lock" style="font-size: 1.2rem; margin-right: 8px;"></i>Apply & pay</h3>
        <button class="modal-close" id="closeModalBtn">&times;</button>
      </div>

      <div class="modal-job-info" id="modalJobInfo">
        <!-- filled via js -->
      </div>

      <div class="payment-summary">
        <span>Application fee</span>
        <span class="amount">$9.99</span>
      </div>

      <p style="font-weight: 500; margin-bottom: 0.5rem; color: var(--neutral-600);">Payment method</p>
      <div class="payment-method" id="paymentMethods">
        <div class="method-option selected" data-method="card">
          <i class="fas fa-credit-card"></i> Card
        </div>
        <div class="method-option" data-method="paypal">
          <i class="fab fa-paypal"></i> PayPal
        </div>
        <div class="method-option" data-method="apple">
          <i class="fab fa-apple"></i> Apple Pay
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" id="cancelPaymentBtn">Cancel</button>
        <button class="btn-pay" id="confirmPayBtn"><i class="fas fa-check-circle"></i> Pay & submit</button>
      </div>
      <p style="font-size: 0.75rem; color: var(--neutral-600); text-align: center; margin-top: 1rem;">
        <i class="fas fa-shield-alt"></i> Secure payment. You will be redirected to the hospital portal.
      </p>
    </div>
  </div>

  <!-- toast -->
  <div class="toast-message" id="toast"><i class="fas fa-check-circle"></i> <span id="toastText">Payment successful!</span></div>

  <script>
    (function() {
      // ---------- REALISTIC HOSPITAL JOB DATA ----------
      const jobs = [
        {
          id: 1,
          title: "Registered Nurse – Emergency",
          hospital: "St. Mary's Medical Center",
          location: "Chicago, IL",

          salary: "$78k – $95k",

        },
        {
          id: 2,
          title: "Cardiologist (Non-invasive)",

        {

        },
        {
          id: 4,
          title: "ICU Nurse – Night Shift",
          hospital: "Johns Hopkins Hospital",
          location: "Baltimore, MD",
          type: "Full-time",
          salary: "$88k – $110k",
          category: "nursing",
          fee: 9.99,
          description: "Critical care nursing in a world-renowned ICU. CCRN preferred. 3x12 hour shifts."
        },
        {
          id: 5,
          title: "Pediatric Surgeon",
          hospital: "Boston Children's Hospital",
          location: "Boston, MA",
          type: "Full-time",
          salary: "$420k – $550k",
          category: "physician",
          fee: 19.99,
          description: "Seeking board-certified pediatric surgeon. Level 1 trauma, academic appointment available."
        },
        {
          id: 6,
          title: "Radiology Technologist",
          hospital: "Stanford Health Care",
          location: "Palo Alto, CA",
          type: "Full-time",
          salary: "$92k – $115k",
          category: "allied",
          fee: 9.99,
          description: "Operate X-ray, CT and fluoroscopy equipment. ARRT required. Day shift, no weekends."
        },
        {
          id: 7,
          title: "Nurse Practitioner – Oncology",
          hospital: "MD Anderson Cancer Center",
          location: "Houston, TX",
          type: "Full-time",
          salary: "$125k – $145k",
          category: "nursing",
          fee: 12.99,
          description: "Support oncology patients in outpatient setting. FNP or AGACNP, oncology experience a plus."
        },
        {
          id: 8,
          title: "Anesthesiologist",
          hospital: "Massachusetts General Hospital",
          location: "Boston, MA",
          type: "Full-time",
          salary: "$360k – $440k",
          category: "physician",
          fee: 14.99,
          description: "Join a collaborative anesthesia team. Board certified/eligible. Diverse surgical cases."
        },
        {
          id: 9,
          title: "Respiratory Therapist",
          hospital: "UCSF Medical Center",
          location: "San Francisco, CA",
          type: "Full-time",
          salary: "$95k – $118k",
          category: "allied",
          fee: 9.99,
          description: "Provide respiratory care in ICU and ER. RRT required, 2 years acute care experience."
        }
      ];

      // DOM elements
      const jobGrid = document.getElementById('jobGrid');
      const searchInput = document.getElementById('searchInput');
      const filterTabs = document.getElementById('filterTabs');
      const paymentModal = document.getElementById('paymentModal');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const cancelPaymentBtn = document.getElementById('cancelPaymentBtn');
      const confirmPayBtn = document.getElementById('confirmPayBtn');
      const modalJobInfo = document.getElementById('modalJobInfo');
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toastText');

      let currentFilter = 'all';
      let currentSearch = '';
      let selectedJob = null;

      // -------- RENDER JOBS --------
      function renderJobs() {
        const filtered = jobs.filter(job => {
          const matchesFilter = currentFilter === 'all' || job.category === currentFilter;
          const searchLower = currentSearch.toLowerCase().trim();
          const matchesSearch = !searchLower ||
            job.title.toLowerCase().includes(searchLower) ||
            job.hospital.toLowerCase().includes(searchLower) ||
            job.location.toLowerCase().includes(searchLower);
          return matchesFilter && matchesSearch;
        });

        if (filtered.length === 0) {
          jobGrid.innerHTML = `<div class="no-results"><i class="fas fa-search" style="font-size: 2rem; opacity: 0.5; margin-bottom: 0.8rem; display: block;"></i>No jobs match your search. Try different keywords.</div>`;
          return;
        }

        jobGrid.innerHTML = filtered.map(job => `
          <div class="job-card" data-job-id="${job.id}">
            <div class="job-header">
              <div class="hospital-icon"><i class="fas fa-hospital-alt"></i></div>
              <div class="salary-badge">${job.salary}</div>
            </div>
            <div class="job-title">${job.title}</div>
            <div class="hospital-name"><i class="fas fa-building"></i> ${job.hospital}</div>
            <div class="job-meta">
              <span><i class="fas fa-map-marker-alt"></i>${job.location}</span>
              <span><i class="fas fa-clock"></i>${job.type}</span>
            </div>
            <div class="job-desc">${job.description}</div>
            <div class="card-footer">
              <span class="fee-tag"><i class="fas fa-tag"></i> Apply fee $${job.fee.toFixed(2)}</span>
              <button class="apply-btn" data-job-id="${job.id}"><i class="fas fa-paper-plane"></i> Apply</button>
            </div>
          </div>
        `).join('');

        // attach apply button listeners
        document.querySelectorAll('.apply-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const jobId = Number(btn.dataset.jobId);
            openPaymentModal(jobId);
          });
        });
      }

      // -------- OPEN MODAL --------
      function openPaymentModal(jobId) {
        const job = jobs.find(j => j.id === jobId);
        if (!job) return;
        selectedJob = job;

        // fill modal
        modalJobInfo.innerHTML = `
          <div class="hospital">${job.hospital}</div>
          <div class="title">${job.title}</div>
          <div style="font-size: 0.9rem; color: var(--neutral-600); margin-top: 4px;"><i class="fas fa-map-marker-alt"></i> ${job.location}</div>
        `;

        // reset payment method selection to card
        document.querySelectorAll('.method-option').forEach(opt => {
          opt.classList.remove('selected');
          if (opt.dataset.method === 'card') opt.classList.add('selected');
        });

        paymentModal.classList.add('open');
      }

      // -------- CLOSE MODAL --------
      function closeModal() {
        paymentModal.classList.remove('open');
        selectedJob = null;
      }

      // -------- SHOW TOAST --------
      function showToast(message, icon = 'fa-check-circle') {
        toastText.textContent = message;
        toast.querySelector('i').className = `fas ${icon}`;
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 3200);
      }

      // -------- CONFIRM PAYMENT (simulated backend) --------
      function handlePayment() {
        if (!selectedJob) return;

        // Simulate payment processing (backend call simulation)
        confirmPayBtn.disabled = true;
        confirmPayBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing…';

        setTimeout(() => {
          // Reset button
          confirmPayBtn.disabled = false;
          confirmPayBtn.innerHTML = '<i class="fas fa-check-circle"></i> Pay & submit';

          // Show success toast with job info
          showToast(`Application submitted for ${selectedJob.title} at ${selectedJob.hospital}!`, 'fa-check-circle');

          // Optionally close modal
          closeModal();

          // Simulate backend: update UI (e.g., mark as applied – just for demo, we could add visual cue)
          // In real app, we would POST to server.
          // For demo, we add a small badge on the job card? (optional)
          // We'll keep it minimal.

        }, 1500);
      }

      // -------- EVENT LISTENERS --------
      // search
      searchInput.addEventListener('input', (e) => {
        currentSearch = e.target.value;
        renderJobs();
      });

      // filter tabs
      filterTabs.addEventListener('click', (e) => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderJobs();
      });

      // close modal buttons
      closeModalBtn.addEventListener('click', closeModal);
      cancelPaymentBtn.addEventListener('click', closeModal);

      // click on overlay closes modal
      paymentModal.addEventListener('click', (e) => {
        if (e.target === paymentModal) closeModal();
      });

      // payment method selection
      document.getElementById('paymentMethods').addEventListener('click', (e) => {
        const option = e.target.closest('.method-option');
        if (!option) return;
        document.querySelectorAll('.method-option').forEach(opt => opt.classList.remove('selected'));
        option.classList.add('selected');
      });

      // confirm payment (pay & submit)
      confirmPayBtn.addEventListener('click', handlePayment);

      // initial render
      renderJobs();

      // handle escape key
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && paymentModal.classList.contains('open')) {
          closeModal();
        }
      });

    })();
  </script>
</body>
</html>
